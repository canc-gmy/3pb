# FEniCSx environment for sandwich3pb.
# dolfinx must come from conda-forge (PyPI wheels are not provided upstream).
#
#   conda env create -f environment.yml
#   conda activate sandwich3pb
#   pip install -e .
name: sandwich3pb
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics-dolfinx=0.11
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - pytest
  - pip
